services:
  mariadb:
    image: mariadb:11
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      - MYSQL_ROOT_PASSWORD=${MARIADB_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MOODLE_DB_NAME}
      - MYSQL_USER=${MOODLE_DB_USER}
      - MYSQL_PASSWORD=${MOODLE_DB_PASSWORD}
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s

  moodle:
    build: .
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      - SERVICE_FQDN_MOODLE_80
      - MOODLE_DB_HOST=mariadb
      - MOODLE_DB_NAME=${MOODLE_DB_NAME}
      - MOODLE_DB_USER=${MOODLE_DB_USER}
      - MOODLE_DB_PASSWORD=${MOODLE_DB_PASSWORD}
      - MOODLE_WWWROOT=${MOODLE_WWWROOT}
    volumes:
      - moodledata:/var/moodledata
      - moodle_config:/var/www/html/config.php

  moodle-cron:
    build: .
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      - MOODLE_DB_HOST=mariadb
      - MOODLE_DB_NAME=${MOODLE_DB_NAME}
      - MOODLE_DB_USER=${MOODLE_DB_USER}
      - MOODLE_DB_PASSWORD=${MOODLE_DB_PASSWORD}
      - MOODLE_WWWROOT=${MOODLE_WWWROOT}
    volumes:
      - moodledata:/var/moodledata
    entrypoint: /bin/bash
    command: -c "source /entrypoint.sh || true; while true; do php /var/www/html/admin/cli/cron.php; sleep 60; done"

volumes:
  mariadb_data:
  moodledata: